name: loopsort
description: Loop Sort - a conveyor-belt sorting puzzle game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: any
  shared_preferences: any
  audioplayers: any
  in_app_purchase: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/audio/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
