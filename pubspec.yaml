name: loopsort
description: Loop Sort - a conveyor-belt sorting puzzle game.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/audio/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
