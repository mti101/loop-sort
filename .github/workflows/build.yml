name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          mkdir -p ci-out
          (flutter --version; dart --version; java -version) 2>&1 | tee ci-out/versions.log

      - name: Scaffold Android
        run: bash tools/setup_android.sh 2>&1 | tee ci-out/scaffold.log

      - name: Apply AdMob app id (if provided)
        run: |
          if [ -n "$ADMOB_APP_ID" ]; then
            sed -i "s#ca-app-pub-3940256099942544~3347511713#$ADMOB_APP_ID#" android/app/src/main/AndroidManifest.xml
            echo "AdMob app id applied"
          else
            echo "No ADMOB_APP_ID secret: using Google test app id"
          fi

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-pub 2>&1 | tee ci-out/analyze.log

      - name: Test (and render golden screenshots)
        continue-on-error: true
        run: |
          flutter test --update-goldens 2>&1 | tee ci-out/test.log
          mkdir -p ci-out/goldens
          cp -r test/goldens/. ci-out/goldens/ 2>/dev/null || true

      - name: Configure release signing
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "release signing configured"
          else
            echo "No keystore secret: release will be debug-signed (NOT for Play upload)"
          fi

      - name: Build AAB
        run: flutter build appbundle --release --no-pub 2>&1 | tee ci-out/build_aab.log

      - name: Build APK (sideload test)
        run: flutter build apk --release --no-pub 2>&1 | tee ci-out/build_apk.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ci-out
          cp build/app/outputs/bundle/release/*.aab ci-out/ 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk ci-out/ 2>/dev/null || true
          echo "commit: $GITHUB_SHA" > ci-out/COMMIT.txt
          mkdir -p ci-out/meta
          cp pubspec.lock ci-out/meta/ 2>/dev/null || true
          cp android/settings.gradle.kts android/app/build.gradle.kts android/gradle/wrapper/gradle-wrapper.properties ci-out/meta/ 2>/dev/null || true
          flutter pub outdated > ci-out/meta/outdated.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopsort-release
          path: |
            ci-out/*.aab
            ci-out/*.apk
          if-no-files-found: warn

      - name: Publish CI output branch
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ci-out
          git init -q -b ci-output
          git config user.name "loopsort-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-output

  smoke:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: loopsort-release
          path: art
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p smoke
            adb install -r art/app-release.apk 2>&1 | tee smoke/install.log
            adb logcat -c
            adb shell monkey -p com.ajoy.loop.puzzle.sort.game -c android.intent.category.LAUNCHER 1 2>&1 | tee smoke/launch.log
            sleep 12
            adb exec-out screencap -p > smoke/shot_12s.png
            sleep 15
            adb exec-out screencap -p > smoke/shot_27s.png
            adb shell pidof com.ajoy.loop.puzzle.sort.game > smoke/pid.txt || echo "NO PROCESS" > smoke/pid.txt
            adb logcat -d > smoke/logcat.txt
            if grep -q 'NO PROCESS' smoke/pid.txt; then echo CRASHED > smoke/RESULT.txt; else echo OK > smoke/RESULT.txt; fi
      - name: Publish smoke output
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke && cd smoke
          git init -q -b ci-smoke
          git config user.name loopsort-ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "smoke" 
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke
